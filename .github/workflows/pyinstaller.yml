name: PyInstaller Binary Distribution

on:
  push:
    tags:
      - "*"

  workflow_dispatch:
    inputs:
      tag_name:
        description: "用于产物命名的 Tag 名称"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.artifact_suffix }} binary
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform_family: windows
            artifact_suffix: windows_x86_64
            os: windows-latest
          - platform_family: linux
            artifact_suffix: linux_x86_64
            os: ubuntu-latest
          - platform_family: linux
            artifact_suffix: linux_arm64
            os: ubuntu-24.04-arm
          - platform_family: macos
            artifact_suffix: macos_x86_64
            os: macos-15-intel
          - platform_family: macos
            artifact_suffix: macos_apple_silicon
            os: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Setup UV
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: |
          uv sync --dev
          uv pip install pip pyinstaller

      - name: Install UPX (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install upx -y
          upx --version

      - name: Build PyInstaller one-dir package
        run: uv run pyinstaller --noconfirm --clean MaiBot.spec

      - name: Archive Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ARTIFACT_DIR: build-artifacts
          ARTIFACT_NAME: MaiBot_${{ matrix.artifact_suffix }}_${{ env.RELEASE_TAG }}.zip
        run: |
          New-Item -ItemType Directory -Force -Path $env:ARTIFACT_DIR | Out-Null
          $ArtifactPath = Join-Path (Resolve-Path $env:ARTIFACT_DIR).Path $env:ARTIFACT_NAME
          Push-Location "dist"
          try {
              7z a -tzip -mx=9 $ArtifactPath "MaiBot"
          }
          finally {
              Pop-Location
          }

      - name: Archive Linux package
        if: runner.os == 'Linux'
        shell: bash
        env:
          ARTIFACT_DIR: build-artifacts
          ARTIFACT_PREFIX: MaiBot_${{ matrix.artifact_suffix }}_${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"
          tar -cf - -C dist MaiBot | xz -T0 -9e > "$ARTIFACT_DIR/${ARTIFACT_PREFIX}.tar.xz"
          tar -cf - -C dist MaiBot | gzip -9 -n > "$ARTIFACT_DIR/${ARTIFACT_PREFIX}.tar.gz"

      - name: Archive macOS package
        if: runner.os == 'macOS'
        shell: bash
        env:
          ARTIFACT_DIR: build-artifacts
          ARTIFACT_PREFIX: MaiBot_${{ matrix.artifact_suffix }}_${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"
          tar -cf - -C dist MaiBot | gzip -9 -n > "$ARTIFACT_DIR/${ARTIFACT_PREFIX}.tar.gz"

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: MaiBot_${{ matrix.artifact_suffix }}
          path: build-artifacts/MaiBot_${{ matrix.artifact_suffix }}_${{ env.RELEASE_TAG }}*
          if-no-files-found: error
          retention-days: 1

  release:
    name: Create release
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v6
        with:
          path: ./artifacts

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            Built from timestamp tag: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ./artifacts/**/MaiBot_*
