name: PyInstaller Binary Distribution

on:
  push:
    tags:
      - "*"

  workflow_dispatch:
    inputs:
      tag_name:
        description: "用于产物命名的 Tag 名称"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }} binary
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            ext: .zip
          - platform: linux
            os: ubuntu-latest
            ext: .tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Setup UV
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: |
          uv sync --dev
          uv pip install pip pyinstaller

      - name: Install UPX (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt update
          sudo apt install -y upx-ucl
          upx --version

      - name: Install UPX (Windows)
        if: matrix.platform == 'windows'
        run: |
          choco install upx -y
          upx --version

      - name: Build PyInstaller one-dir package
        run: uv run pyinstaller --noconfirm --clean MaiBot.spec

      - name: Prepare external runtime resources
        shell: pwsh
        run: |
          $AppRoot = Join-Path "dist" "MaiBot"
          New-Item -ItemType Directory -Force -Path (Join-Path $AppRoot "plugins") | Out-Null

      - name: Archive Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ARTIFACT_NAME: MaiBot_${{ matrix.platform }}_${{ env.RELEASE_TAG }}${{ matrix.ext }}
        run: |
          New-Item -ItemType Directory -Force -Path ".artifacts" | Out-Null
          $ArtifactPath = Join-Path (Resolve-Path ".artifacts").Path $env:ARTIFACT_NAME
          Push-Location "dist"
          try {
              7z a -tzip -mx=9 $ArtifactPath "MaiBot"
          }
          finally {
              Pop-Location
          }

      - name: Archive Linux package
        if: runner.os == 'Linux'
        shell: bash
        env:
          ARTIFACT_NAME: MaiBot_${{ matrix.platform }}_${{ env.RELEASE_TAG }}${{ matrix.ext }}
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          tar -I 'gzip -9' -cf ".artifacts/${ARTIFACT_NAME}" -C dist MaiBot

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: MaiBot_${{ matrix.platform }}
          path: .artifacts/MaiBot_${{ matrix.platform }}_${{ env.RELEASE_TAG }}${{ matrix.ext }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: Create draft release
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v6
        with:
          path: ./artifacts

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            Built from timestamp tag: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ./artifacts/MaiBot_windows/*
            ./artifacts/MaiBot_linux/*
